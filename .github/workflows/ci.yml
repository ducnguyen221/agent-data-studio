name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      # Khoảng hỗ trợ 3.11–3.14 (pyproject requires-python). 3.14 chỉ kiểm unit/CI, chưa kiểm ADOMD live.
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Lint
        run: ruff check powerbi_agent tests mcp_server_powerbi.py scripts
      - name: Unit tests (không cần Power BI Desktop)
        run: pytest tests -m "not integration" -v
