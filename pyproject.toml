[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powerbi-agent"
version = "0.6.0"
description = "MCP server + skills for AI agents to work directly with Power BI — DAX query with data-safety policy, PBIR report templates, end-to-end analysis pipeline"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Duc Nguyen (ducnguyen221)" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.27",
    "pyadomd>=0.1.1",
    "pythonnet>=3.0",
    "pandas>=2.2",
    "msal>=1.31",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "tabulate>=0.9",
]

[project.optional-dependencies]
# PIN ruff: bo rule mac dinh doi theo phien ban, khong pin = CI do ngau nhien.
dev = ["pytest>=8", "ruff==0.16.1"]

[project.scripts]
powerbi-agent = "powerbi_agent.app:main"

[project.urls]
Repository = "https://github.com/ducnguyen221/powerbi-agent"

[tool.setuptools]
packages = ["powerbi_agent"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# KHAI BÁO TƯỜNG MINH bộ rule. Trước đây để trống `select` = nhận mặc định của ruff,
# mà mặc định ĐỔI THEO PHIÊN BẢN: ruff 0.16 mở rộng bộ mặc định -> CI (cài bản mới nhất)
# đỏ 91 lỗi trong khi local (0.15) xanh, dù không ai sửa dòng code nào.
# Đây là bộ ruff vẫn áp dụng từ trước: pycodestyle lỗi thật + pyflakes.
select = ["E4", "E7", "E9", "F"]
# E402: import sau code là CHỦ ĐÍCH (load_adomd phải chạy trước import pyadomd)
ignore = ["E402"]

[tool.pytest.ini_options]
markers = [
    "integration: cần Power BI Desktop đang mở (bỏ qua trên CI)",
]
